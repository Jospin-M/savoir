name: CI

on:
  push: 
    branches: [ main ]
  pull_request:
    branches: [ main ]
    
jobs:
  lint-backend: 
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./code/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Clean install
        run: npm ci
      - name: Run linter
        run: npm run lint

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./code/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npx eslint src
